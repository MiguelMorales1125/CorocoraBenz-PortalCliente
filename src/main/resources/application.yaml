server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: 9001
  servlet:
    session:
      cookie:
        # Las cookies de localhost se comparten entre puertos: cada portal usa su propio nombre.
        name: CBSESSION_CLIENTE
        same-site: lax
        http-only: true

spring:
  application:
    name: cb-portal-cliente
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:corocora}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  jackson:
    deserialization:
      # Un kilometraje con decimales se rechaza con 400 en vez de truncarse en silencio.
      accept-float-as-int: false

corocora:
  # Credencial con la que este portal se identifica ante el motor.
  internal-token: ${COROCORA_INTERNAL_TOKEN:cb-local-interno-demo}
  # REST API de Camunda en CB-BPM-Engine. Solo la usa el servidor, nunca el navegador.
  engine-rest: ${ENGINE_REST_URL:http://localhost:9000/engine-rest}
  portal:
    # Activa la sesión de portal de cb-comun (/api/app/login, /me, CSRF).
    habilitado: true

---
# Perfil para correr sin PostgreSQL: --spring.profiles.active=h2
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:mem:cb-portal-cliente;DB_CLOSE_DELAY=-1
    username: sa
    password:
